server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the browser from treating a successful XSS or framing attempt as a
    # full account compromise. Sources match the explicitly integrated Web SDKs.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://models.readyplayer.me; connect-src 'self' https://fcmregistrations.googleapis.com https://*.googleapis.com https://*.firebaseio.com wss:; frame-src https://demo.readyplayer.me https://maps.google.com; worker-src 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self \"https://demo.readyplayer.me\"), microphone=(self \"https://demo.readyplayer.me\"), geolocation=(), payment=(), usb=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
