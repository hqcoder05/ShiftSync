name: Java CI with Maven

on:
  push:
    branches: [ main, master, quoc-backend, duyen-frontend ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shiftsync_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'oracle'
        cache: 'maven'
        cache-dependency-path: 'shiftsync-backend/pom.xml'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'ShiftSync-Web/package-lock.json'

    - name: Build web application
      run: npm ci && npm run build
      working-directory: ShiftSync-Web

    - name: Run Maven Tests
      run: mvn -B --no-transfer-progress clean test
      working-directory: shiftsync-backend
      env:
        TEST_DB_HOST: localhost
        TEST_DB_PORT: 5432
        TEST_DB_NAME: shiftsync_test
        TEST_DB_USER: postgres
        TEST_DB_PASSWORD: postgres
        TEST_REDIS_HOST: localhost
        TEST_REDIS_PORT: 6379
        JWT_SECRET: dummy-secret-key-for-testing-in-ci-cd-pipeline-minimum-32-chars
        JWT_EXPIRATION_MS: 86400000

    - name: Create isolated scheduler test database
      run: docker exec "${{ job.services.postgres.id }}" createdb -U postgres shiftsync_scheduler_test

    - name: Preserve default suite reports
      run: cp -R target/surefire-reports target/default-suite-reports
      working-directory: shiftsync-backend

    - name: Run PostgreSQL transaction regressions
      run: mvn -B --no-transfer-progress -Dshiftsync.scheduler.postgres-tests=true -Dtest=SchedulingPostgresIntegrationTest test
      working-directory: shiftsync-backend
      env:
        TEST_DB_PORT: 5432
        TEST_DB_USER: postgres
        TEST_DB_PASSWORD: postgres
        TEST_REDIS_PORT: 6379

    - name: Retain test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-reports
        path: |
          shiftsync-backend/target/surefire-reports/
          shiftsync-backend/target/default-suite-reports/
        retention-days: 14
