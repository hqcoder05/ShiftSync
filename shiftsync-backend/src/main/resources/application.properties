spring.application.name=shiftsync-backend
# Development commands may be run from either the repository root or this
# module. Both locations resolve the single root .env without requiring a
# second credential file inside shiftsync-backend.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Camera uploads: real mobile photos can exceed the Spring default 1 MB limit.
# Keep the limit configurable per environment; the local/dev default is 10 MB.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:shiftsync}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# API responses must be fully assembled inside their service transaction.
# This prevents hidden database queries during JSON serialization.
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
# Redis is used for locks, token/session protection and cache only. There are
# no Redis-backed repository entities, so avoid scanning every JPA repository
# during startup and emitting misleading repository-assignment messages.
spring.data.redis.repositories.enabled=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Optional one-time bootstrap for an empty installation. Leave both values
# unset after the first ADMIN exists; secrets must stay in runtime environment.
app.bootstrap.admin.email=${INITIAL_ADMIN_EMAIL:}
app.bootstrap.admin.password=${INITIAL_ADMIN_PASSWORD:}
app.bootstrap.admin.full-name=${INITIAL_ADMIN_FULL_NAME:System Administrator}
app.bootstrap.admin.allow-existing=${INITIAL_ADMIN_ALLOW_EXISTING:false}
# Redis-backed protection against password guessing. Durations use ISO-8601.
app.security.login-rate-limit.max-failures=${LOGIN_RATE_LIMIT_MAX_FAILURES:5}
app.security.login-rate-limit.failure-window=${LOGIN_RATE_LIMIT_FAILURE_WINDOW:PT15M}
app.security.login-rate-limit.lock-duration=${LOGIN_RATE_LIMIT_LOCK_DURATION:PT15M}
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}


# Firebase Admin SDK Configuration
firebase.config.path=classpath:firebase-service-account.json

# SpringDoc / Swagger Configuration
springdoc.packages-to-scan=com.shiftsync
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
spring.jpa.properties.hibernate.generate_statistics=${HIBERNATE_GENERATE_STATISTICS:false}
logging.level.org.hibernate.stat=${HIBERNATE_STAT_LOG_LEVEL:WARN}
# SecurityConfig registers the application DaoAuthenticationProvider explicitly
# for the JWT/stateless chain. This Spring advisory is expected, not an
# authentication failure; application security logs remain at their defaults.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR


cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8081,http://localhost:8085}
auth.refresh-cookie.secure=${AUTH_REFRESH_COOKIE_SECURE:false}


