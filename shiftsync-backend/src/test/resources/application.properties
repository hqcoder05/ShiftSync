spring.application.name=shiftsync-backend
# CI supplies TEST_DB_* explicitly. For local runs, read the single root .env
# so this profile can authenticate to the isolated shiftsync_test database
# without duplicating credentials inside this module.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Camera uploads: real mobile photos can exceed the Spring default 1 MB limit.
# Keep the limit configurable per environment; the local/dev default is 10 MB.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Database Configuration
spring.datasource.url=jdbc:postgresql://${TEST_DB_HOST:127.0.0.1}:${TEST_DB_PORT:5432}/${TEST_DB_NAME:shiftsync_test}
spring.datasource.username=${TEST_DB_USER:postgres}
# CI supplies TEST_DB_PASSWORD for its isolated PostgreSQL service. Local runs
# otherwise reuse the root Docker credential instead of assuming "postgres".
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
# Individual performance tests enable Hibernate statistics explicitly when
# required. Keeping it off for the normal suite makes CI output actionable
# instead of printing every SQL statement twice.
spring.jpa.show-sql=false
# Keep the test boundary identical to production: API mapping must not trigger
# hidden lazy queries after the service transaction completes. Hibernate 7 also
# selects PostgreSQLDialect automatically from the JDBC connection.
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis Configuration
spring.data.redis.host=${TEST_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${TEST_REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:shiftsync-dev-secret-key-change-in-production-min-32-chars!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}


# Firebase Admin SDK Configuration
firebase.config.path=classpath:firebase-service-account.json

# SpringDoc / Swagger Configuration
springdoc.packages-to-scan=com.shiftsync
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
logging.level.org.hibernate.SQL=WARN
spring.jpa.properties.hibernate.generate_statistics=false
logging.level.org.hibernate.stat=WARN
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR


cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8081

# Kết thúc cấu hình kiểm thử
