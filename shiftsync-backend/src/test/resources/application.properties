spring.application.name=shiftsync-backend
# Test configuration intentionally does not load the operational .env file.

# Camera uploads: real mobile photos can exceed the Spring default 1 MB limit.
# Keep the limit configurable per environment; the local/dev default is 10 MB.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Database Configuration
spring.datasource.url=jdbc:postgresql://${TEST_DB_HOST:127.0.0.1}:${TEST_DB_PORT:5432}/${TEST_DB_NAME:shiftsync_test}
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis Configuration
spring.data.redis.host=${TEST_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${TEST_REDIS_PORT:6379}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:shiftsync-dev-secret-key-change-in-production-min-32-chars!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}


# Firebase Admin SDK Configuration
firebase.config.path=classpath:firebase-service-account.json

# SpringDoc / Swagger Configuration
springdoc.packages-to-scan=com.shiftsync
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG


cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8081

# Kết thúc cấu hình kiểm thử
