# Disposable database on the stabilization PostgreSQL instance; never use shiftsync.
spring.datasource.url=jdbc:postgresql://127.0.0.1:55432/shiftsync_scheduler_test
spring.datasource.username=postgres
spring.datasource.password=stabilization-local-only
spring.data.redis.host=127.0.0.1
spring.data.redis.port=56379
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.connection-timeout=10000
app.jwt.secret=scheduler-test-only-secret-at-least-thirty-two-characters
logging.level.com.shiftsync.shift.service.AutoScheduleService=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.data.repository.config=WARN
