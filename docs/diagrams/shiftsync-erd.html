<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShiftSync · ERD</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #ffffff;
      --color-ink: #1e232d;
      --color-muted: #5a6578;
      --color-soft: #8896ab;
      --color-rule: rgba(30, 35, 45, 0.12);
      --color-accent: #e65100;
      --color-blue: #1565c0;
      --color-green: #2e7d32;
      --color-purple: #6a1b9a;
      --color-teal: #00695c;
      --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-sans);
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .diagram-frame {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div class="diagram-frame">
    <svg viewBox="0 0 1680 1150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="erd-title erd-desc">
      <title id="erd-title">ShiftSync Full Relational ERD</title>
      <desc id="erd-desc">Comprehensive Entity Relationship Diagram of ShiftSync showing Core Domains, Tables, PKs, FKs and Cardinalities.</desc>

      <defs>
        <!-- Background Grid -->
        <pattern id="grid-dots" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="1" fill="#e2e8f0" />
        </pattern>

        <!-- Arrow Markers -->
        <marker id="arrow-def" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#5a6578"/>
        </marker>
        <marker id="arrow-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#e65100"/>
        </marker>
        <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>
      <rect width="100%" height="100%" fill="url(#grid-dots)"/>

      <!-- ========================================================================= -->
      <!-- BOUNDED CONTEXT BACKGROUND ZONES (CONTAINMENT RECTS)                     -->
      <!-- ========================================================================= -->

      <!-- Domain 1: Org & Identity (Top-Left) -->
      <rect x="30" y="30" width="510" height="430" rx="10" fill="rgba(21, 101, 192, 0.03)" stroke="rgba(21, 101, 192, 0.25)" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="45" y="52" fill="#1565c0" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.12em">1. IDENTITY &amp; ORGANIZATION DOMAIN</text>

      <!-- Domain 2: Competency & Availability (Bottom-Left) -->
      <rect x="30" y="480" width="510" height="430" rx="10" fill="rgba(46, 125, 50, 0.03)" stroke="rgba(46, 125, 50, 0.25)" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="45" y="502" fill="#2e7d32" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.12em">2. COMPETENCY &amp; AVAILABILITY DOMAIN</text>

      <!-- Domain 3: Scheduling & Spatial Core (Center - Focal) -->
      <rect x="560" y="30" width="560" height="880" rx="10" fill="rgba(230, 81, 0, 0.03)" stroke="rgba(230, 81, 0, 0.3)" stroke-width="1.4" stroke-dasharray="6,4"/>
      <text x="575" y="52" fill="#e65100" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.12em">3. SCHEDULING, TEMPLATES &amp; SPATIAL ALLOCATION (CORE)</text>

      <!-- Domain 4: Attendance & Time Tracking (Top-Right) -->
      <rect x="1140" y="30" width="510" height="430" rx="10" fill="rgba(0, 105, 92, 0.03)" stroke="rgba(0, 105, 92, 0.25)" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="1155" y="52" fill="#00695c" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.12em">4. ATTENDANCE &amp; GEOFENCING DOMAIN</text>

      <!-- Domain 5: Marketplace & Workforce Sharing (Middle-Right) -->
      <rect x="1140" y="480" width="510" height="430" rx="10" fill="rgba(106, 27, 154, 0.03)" stroke="rgba(106, 27, 154, 0.25)" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="1155" y="502" fill="#6a1b9a" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.12em">5. MARKETPLACE, LEAVE &amp; WORKFORCE SHARING</text>

      <!-- Domain 6: Payroll & Configuration (Bottom Strip) -->
      <rect x="30" y="930" width="1620" height="145" rx="10" fill="rgba(90, 101, 120, 0.03)" stroke="rgba(90, 101, 120, 0.2)" stroke-width="1.2" stroke-dasharray="4,4"/>
      <text x="45" y="952" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.12em">6. PAYROLL CALCULATION, SYSTEM CONFIGURATION &amp; AUDIT TRAIL</text>


      <!-- ========================================================================= -->
      <!-- CONNECTOR RELATIONSHIPS (DRAWN BEFORE ENTITIES)                          -->
      <!-- ========================================================================= -->

      <!-- Store -> Employment (1:N) -->
      <path d="M 165,225 V 270" fill="none" stroke="#5a6578" stroke-width="1.2"/>
      <text x="175" y="240" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="8">1</text>
      <text x="175" y="265" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="8">N</text>

      <!-- Staff -> Employment (1:N) -->
      <path d="M 375,225 V 270" fill="none" stroke="#5a6578" stroke-width="1.2"/>
      <text x="385" y="240" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="8">1</text>
      <text x="385" y="265" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="8">N</text>

      <text x="280" y="390" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="8">N</text>

      <!-- Store -> Skill (1:N) -->

      <text x="240" y="572" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="8">1</text>
      <text x="290" y="572" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="8">N</text>

      <!-- Staff -> StaffSkill (1:N) -->

      <!-- Shift -> ShiftAssignment (1:N) -->

      <text x="880" y="482" fill="#e65100" font-family="'Geist Mono', monospace" font-size="8">N</text>

      <!-- ShiftAssignment -> Attendance (1:1) -->
      <path d="M 870,300 H 1170" fill="none" stroke="#00695c" stroke-width="1.4"/>
      <text x="880" y="292" fill="#00695c" font-family="'Geist Mono', monospace" font-size="8">1</text>
      <text x="1155" y="292" fill="#00695c" font-family="'Geist Mono', monospace" font-size="8">1 (UQ)</text>

      <!-- Attendance -> AttendanceAdjustmentRequest (1:N) -->
      <path d="M 1270,360 V 390" fill="none" stroke="#00695c" stroke-width="1.2"/>
      <text x="1280" y="372" fill="#00695c" font-family="'Geist Mono', monospace" font-size="8">1</text>
      <text x="1280" y="388" fill="#00695c" font-family="'Geist Mono', monospace" font-size="8">N</text>

      <!-- Store -> StoreLayout (1:N) -->
      <path d="M 770,440 V 670" fill="none" stroke="#e65100" stroke-width="1.2"/>
      <text x="780" y="455" fill="#e65100" font-family="'Geist Mono', monospace" font-size="8">1</text>
      <text x="780" y="660" fill="#e65100" font-family="'Geist Mono', monospace" font-size="8">N</text>

      <!-- StoreLayout -> StoreZone (1:N) -->
      <path d="M 870,720 H 920" fill="none" stroke="#e65100" stroke-width="1.2"/>
      <text x="880" y="712" fill="#e65100" font-family="'Geist Mono', monospace" font-size="8">1</text>
      <text x="905" y="712" fill="#e65100" font-family="'Geist Mono', monospace" font-size="8">N</text>

      <!-- StoreZone -> Workstation (1:N) -->
      <path d="M 1010,790 V 820" fill="none" stroke="#e65100" stroke-width="1.2"/>
      <text x="1020" y="802" fill="#e65100" font-family="'Geist Mono', monospace" font-size="8">1</text>
      <text x="1020" y="818" fill="#e65100" font-family="'Geist Mono', monospace" font-size="8">N</text>

      <!-- Shift -> ShiftSwapRequest (1:N) -->

      <text x="1155" y="702" fill="#6a1b9a" font-family="'Geist Mono', monospace" font-size="8">N</text>

      <!-- Store -> PayrollPeriod (1:N) -->
      <path d="M 70,225 V 975" fill="none" stroke="#5a6578" stroke-width="1.2"/>
      <text x="78" y="965" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="8">N</text>

      <!-- PayrollPeriod -> Payroll (1:N) -->
      <path d="M 230,1025 H 280" fill="none" stroke="#5a6578" stroke-width="1.2"/>
      <text x="240" y="1017" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="8">1</text>
      <text x="270" y="1017" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="8">N</text>


      <!-- ========================================================================= -->
      <!-- ENTITY TABLES (GROUP 1: IDENTITY & ORG)                                  -->
      <!-- ========================================================================= -->

      <!-- TABLE: STORE -->
      <g transform="translate(60, 70)">
        <rect width="170" height="155" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.4"/>
        <rect width="170" height="28" rx="6" fill="#1565c0"/>
        <rect y="20" width="170" height="8" fill="#1565c0"/>
        <text x="10" y="18" fill="#ffffff" font-family="'Geist', sans-serif" font-size="11" font-weight="700">STORE</text>
        <text x="160" y="18" fill="rgba(255,255,255,0.8)" font-family="'Geist Mono', monospace" font-size="7.5" text-anchor="end">TABLE</text>
        
        <!-- Columns -->
        <text x="10" y="44" fill="#1e232d" font-family="'Geist Mono', monospace" font-size="9" font-weight="600"># id</text>
        <text x="160" y="44" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end">UUID · PK</text>
        <line x1="0" y1="52" x2="170" y2="52" stroke="rgba(30,35,45,0.06)"/>

        <text x="10" y="66" fill="#1e232d" font-family="'Geist', sans-serif" font-size="9">name</text>
        <text x="160" y="66" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end">VARCHAR(150)</text>
        
        <text x="10" y="84" fill="#1e232d" font-family="'Geist', sans-serif" font-size="9">address</text>
        <text x="160" y="84" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end">VARCHAR(255)</text>

        <text x="10" y="102" fill="#1e232d" font-family="'Geist', sans-serif" font-size="9">lat / lng</text>
        <text x="160" y="102" fill="#5a6578" font-family="'Geist Mono', monospace" font-size="8" text-anchor="end">DECIMAL(10,7)</text>

        <text x="10" y="120" fill="#1e232d" font-family="'Geist', sans-serif" font-size="9">open / close_time</text>

      </g>

      <!-- TABLE: STAFF (USER) -->

        <rect width="190" height="155" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.4"/>

      <!-- TABLE: STAFF_SKILL -->
