name: shiftsync

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-shiftsync}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PUBLIC_PORT:-5432}:5432"
    volumes:
      - shiftsync-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shiftsync-network

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLIC_PORT:-6379}:6379"
    volumes:
      - shiftsync-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shiftsync-network

  backend:
    build:
      context: ./shiftsync-backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-shiftsync}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-shiftsync-dev-secret-key-change-in-production-min-32-chars!!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shiftsync-network

  web:
    build:
      context: ./ShiftSync-Web
      dockerfile: Dockerfile
      target: development
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      VITE_API_URL: ${WEB_PUBLIC_API_URL:-http://localhost:8080/api}
    volumes:
      - ./ShiftSync-Web:/app
      - shiftsync-web-node-modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - shiftsync-network

  mobile:
    build:
      context: ./ShiftSync-Mobile
      dockerfile: Dockerfile
    ports:
      - "${EXPO_PORT:-8081}:8081"
      - "${EXPO_DEVTOOLS_PORT:-19000}:19000"
      - "${EXPO_LAN_PORT:-19001}:19001"
      - "${EXPO_TUNNEL_PORT:-19002}:19002"
    environment:
      EXPO_PUBLIC_API_URL: ${MOBILE_PUBLIC_API_URL:-http://${EXPO_HOST_IP:-host.docker.internal}:8080/api}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${EXPO_HOST_IP:-host.docker.internal}
    volumes:
      - ./ShiftSync-Mobile:/app
      - shiftsync-mobile-node-modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - shiftsync-network

networks:
  shiftsync-network:
    name: shiftsync-network

volumes:
  shiftsync-pgdata:
  shiftsync-redisdata:
  shiftsync-web-node-modules:
  shiftsync-mobile-node-modules:
